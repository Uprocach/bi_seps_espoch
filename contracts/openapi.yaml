        - seps_41_rendimiento_de_la_cartera_de_cr_
        - seps_42_rendimiento_de_la_cartera_de_cr_
        - seps_43_rendimiento_de_la_cartera_de_mic
        - seps_44_rendimiento_de_la_cartera_de_cr_
        - seps_45_rendimiento_de_la_cartera_de_cr_
