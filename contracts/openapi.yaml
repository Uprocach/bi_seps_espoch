openapi: 3.1.0
info:
  title: Sistema de Indicadores Financieros SFPS
  version: 1.0.0
  summary: API analítica de indicadores financieros del sector cooperativo ecuatoriano (SEPS).
  description: |
    Contrato vinculante (Spec-Driven Development) de la plataforma analítica de indicadores
    financieros del Sector Financiero Popular y Solidario (SFPS) del Ecuador.

    * **Fuente de datos:** Estructura de Estados Financieros **B11** publicada por la SEPS.
    * **Metodología:** Fichas Metodológicas de Indicadores Financieros V3.0 (SEPS).
    * **Catálogo de indicadores:** `config/indicators_spec.json` (fuente única de verdad de fórmulas).

    Convenciones:
    * Los periodos se expresan como `YYYY-MM` (mes de la fecha de corte).
    * Los indicadores se expresan en porcentaje (`unit: percent`), p. ej. `7.84` = 7,84 %.
    * Para los niveles `segment` y `country` se agrega como *ratio de sumas* (numerador y
      denominador sumados entre entidades), no como promedio de ratios.
    * Los errores siguen RFC 9457 (`application/problem+json`).
  contact:
    name: Equipo Sistema de Indicadores
    email: indicadores@example.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Backend FastAPI (desarrollo local)
  - url: http://127.0.0.1:4010
    description: Servidor mock Prism
tags:
  - name: Metadata
    description: Catálogos para poblar filtros de la interfaz (segmentos, provincias, periodos, indicadores).
  - name: Entities
    description: Directorio de entidades financieras (cooperativas y mutualistas) supervisadas por la SEPS.
  - name: Indicators
    description: Series de tiempo de indicadores financieros a nivel país, segmento o entidad.

paths:
  /api/v1/metadata/filters:
    get:
      tags: [Metadata]
      operationId: getMetadataFilters
      summary: Catálogos de filtros
      description: |
        Devuelve los valores disponibles para los filtros globales del dashboard: segmentos,
        provincias, rango de periodos con datos y catálogo de indicadores calculables.
      responses:
        '200':
          description: Catálogos de filtros disponibles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiltersMetadata'
              examples:
                default:
                  summary: Catálogo vigente (datos hasta dic-2025)
                  value:
                    segments:
                      - code: SEGMENTO_1
                        label: Segmento 1
                        reporting_frequency: monthly
                        entity_count: 43
                      - code: SEGMENTO_1_MUTUALISTA
                        label: Segmento 1 - Mutualistas
                        reporting_frequency: monthly
                        entity_count: 4
                      - code: SEGMENTO_2
                        label: Segmento 2
                        reporting_frequency: monthly
                        entity_count: 63
                      - code: SEGMENTO_3
                        label: Segmento 3
                        reporting_frequency: monthly
                        entity_count: 93
                    provinces:
                      - code: '01'
                        name: AZUAY
                        entity_count: 31
                      - code: '17'
                        name: PICHINCHA
                        entity_count: 99
                      - code: '18'
                        name: TUNGURAHUA
                        entity_count: 75
                    periods:
                      frequency: monthly
                      min: '2018-01'
                      max: '2025-12'
                      latest: '2025-12'
                      available: ['2025-07', '2025-08', '2025-09', '2025-10', '2025-11', '2025-12']
                    indicators:
                      - id: morosidad_cartera_total
                        name: Morosidad de cartera total
                        short_name: Morosidad
                        category: calidad_de_activos
                        unit: percent
                        decimals: 2
                        polarity: lower_is_better
                        seps_ficha_number: 5
                      - id: cobertura_cartera_improductiva
                        name: Cobertura de la cartera improductiva (problemática)
                        short_name: Cobertura
                        category: calidad_de_activos
                        unit: percent
                        decimals: 2
                        polarity: higher_is_better
                        seps_ficha_number: 18
                      - id: roa
                        name: Rentabilidad sobre activos (ROA)
                        short_name: ROA
                        category: rentabilidad
                        unit: percent
                        decimals: 2
                        polarity: higher_is_better
                        seps_ficha_number: 35
                      - id: solvencia_patrimonial
                        name: Solvencia patrimonial (Suficiencia patrimonial)
                        short_name: Suficiencia patrimonial
                        category: capital
                        unit: percent
                        decimals: 2
                        polarity: higher_is_better
                        seps_ficha_number: 1
                    data_as_of: '2025-12-31'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/entities:
    get:
      tags: [Entities]
      operationId: listEntities
      summary: Listado de entidades
      description: |
        Lista paginada de cooperativas y mutualistas con filtros por segmento, provincia,
        texto libre (razón social o RUC) y estado de reporte.
      parameters:
        - $ref: '#/components/parameters/SegmentFilter'
        - $ref: '#/components/parameters/ProvinceFilter'
        - name: q
          in: query
          description: Búsqueda parcial, sin distinción de mayúsculas, por razón social o RUC.
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 100
            example: jardin
        - name: active
          in: query
          description: Si es `true`, sólo entidades que reportaron en el último periodo disponible.
          required: false
          schema:
            type: boolean
            default: true
            example: true
        - name: sort
          in: query
          description: Campo de ordenamiento. Prefijo `-` para orden descendente.
          required: false
          schema:
            type: string
            enum: [razon_social, -razon_social, total_assets_usd, -total_assets_usd]
            default: -total_assets_usd
            example: -total_assets_usd
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de entidades que cumplen los filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityListResponse'
              examples:
                default:
                  summary: Entidades del Segmento 1 ordenadas por activo
                  value:
                    data:
                      - ruc: '0190155722001'
                        razon_social: COOPERATIVA DE AHORRO Y CREDITO JARDIN AZUAYO LIMITADA
                        entity_type: COOPERATIVA
                        segment: SEGMENTO_1
                        province:
                          code: '01'
                          name: AZUAY
                        total_assets_usd: 2276134441.47
                        first_period: '2018-01'
                        last_period: '2025-12'
                        is_active: true
                      - ruc: '1790866084001'
                        razon_social: COOPERATIVA DE AHORRO Y CREDITO POLICIA NACIONAL LIMITADA
                        entity_type: COOPERATIVA
                        segment: SEGMENTO_1
                        province:
                          code: '17'
                          name: PICHINCHA
                        total_assets_usd: 1482857501.1
                        first_period: '2018-01'
                        last_period: '2025-12'
                        is_active: true
                    pagination:
                      page: 1
                      page_size: 2
                      total_items: 43
                      total_pages: 22
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/indicators/series:
    get:
      tags: [Indicators]
      operationId: getIndicatorSeries
      summary: Series de tiempo de un indicador
      description: |
        Devuelve la serie mensual de un indicador para el nivel solicitado:

        * `level=country`: una única serie del sistema (todas las entidades).
        * `level=segment`: una serie por segmento. `segment` filtra los segmentos devueltos (opcional).
        * `level=entity`: una serie por RUC. **`ruc` es obligatorio** (máx. 10).

        `province` restringe el universo de entidades antes de agregar. Si se omite `from`/`to`
        se devuelven los últimos 12 periodos disponibles. Combinaciones inválidas de parámetros
        (p. ej. `level=entity` sin `ruc`, o `from` > `to`) responden `422`.
      parameters:
        - name: indicator
          in: query
          description: Identificador del indicador (ver `config/indicators_spec.json`).
          required: true
          schema:
            $ref: '#/components/schemas/IndicatorId'
        - name: level
          in: query
          description: Nivel de agregación de la serie.
          required: true
          schema:
            $ref: '#/components/schemas/AggregationLevel'
        - $ref: '#/components/parameters/SegmentFilter'
        - $ref: '#/components/parameters/ProvinceFilter'
        - name: ruc
          in: query
          description: RUC(s) de las entidades. Obligatorio cuando `level=entity`.
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Ruc'
            example: ['1790866084001', '0190021513001']
        - name: from
          in: query
          description: Periodo inicial (inclusive), formato `YYYY-MM`.
          required: false
          schema:
            $ref: '#/components/schemas/Period'
        - name: to
          in: query
          description: Periodo final (inclusive), formato `YYYY-MM`.
          required: false
          schema:
            $ref: '#/components/schemas/Period'
      responses:
        '200':
          description: Serie(s) de tiempo del indicador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSeriesResponse'
              examples:
