                      decimals: 2
                      polarity: lower_is_better
                      seps_ficha_number: 5
                    level: country
                    frequency: monthly
                    period_range:
                      from: '2025-10'
                      to: '2025-12'
                    filters_applied:
                      segment: []
                      province: []
                      ruc: []
                    series:
                      - key: EC
                        label: Sistema SFPS (Segmentos 1-3 y Mutualistas)
                        level: country
