components:
  parameters:
    SegmentFilter:
      name: segment
      in: query
      description: Uno o varios segmentos (repetir el parámetro, p. ej. `segment=SEGMENTO_1&segment=SEGMENTO_2`).
      required: false
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/SegmentCode'
        example: [SEGMENTO_1, SEGMENTO_2]
    ProvinceFilter:
      name: province
      in: query
      description: Uno o varios códigos de provincia DPA-INEC de 2 dígitos (provincia de la matriz).
      required: false
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/ProvinceCode'
        example: ['17', '01']
    Page:
      name: page
      in: query
      description: Número de página (base 1).
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PageSize:
      name: page_size
      in: query
      description: Tamaño de página.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50

  headers:
    CacheControl:
      description: Política de caché; los catálogos cambian sólo con cada carga mensual del ETL.
      schema:
        type: string
        example: public, max-age=3600

  responses:
    BadRequest:
      description: Solicitud mal formada (p. ej. parámetro con formato inválido).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPeriod:
              summary: Periodo con formato inválido
              value:
                type: https://sistema-indicadores.local/problems/invalid-parameter
                title: Parámetro inválido
                status: 400
                detail: "El parámetro 'from' debe tener el formato YYYY-MM."
                instance: /api/v1/indicators/series?indicator=roa&level=country&from=2025-13
                errors:
                  - field: from
                    message: does not match pattern ^\d{4}-(0[1-9]|1[0-2])$
    NotFound:
      description: Recurso solicitado inexistente (p. ej. RUC sin datos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rucNotFound:
              summary: RUC sin información
              value:
                type: https://sistema-indicadores.local/problems/not-found
                title: Recurso no encontrado
                status: 404
                detail: No existen datos para el RUC 0999999999001 en el rango solicitado.
                instance: /api/v1/indicators/series?indicator=roa&level=entity&ruc=0999999999001
    UnprocessableEntity:
      description: Parámetros válidos individualmente pero inconsistentes entre sí.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingRuc:
              summary: level=entity sin RUC
              value:
                type: https://sistema-indicadores.local/problems/validation-error
                title: Error de validación
                status: 422
                detail: "El parámetro 'ruc' es obligatorio cuando level=entity."
                instance: /api/v1/indicators/series?indicator=roa&level=entity
                errors:
                  - field: ruc
                    message: required when level=entity
    InternalError:
      description: Error inesperado del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unexpected:
              summary: Error interno
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: Ocurrió un error inesperado. Intente nuevamente más tarde.

  schemas:
    # ---------- Tipos primitivos de dominio ----------
    Period:
      type: string
      description: Mes de la fecha de corte en formato `YYYY-MM`.
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      example: '2025-12'
    Ruc:
      type: string
      description: Registro Único de Contribuyentes de la entidad (13 dígitos, termina en 001).
      pattern: ^\d{10}001$
      example: '1790866084001'
    SegmentCode:
      type: string
      description: Segmento de la entidad según la normativa de la Junta de Política y Regulación Financiera.
      enum:
        - SEGMENTO_1
        - SEGMENTO_1_MUTUALISTA
        - SEGMENTO_2
        - SEGMENTO_3
        - SEGMENTO_4
        - SEGMENTO_5
      example: SEGMENTO_1
    ProvinceCode:
      type: string
      description: Código de provincia de la División Político-Administrativa (DPA) del INEC.
      pattern: ^(0[1-9]|1[0-9]|2[0-4]|90)$
      example: '17'
    IndicatorId:
      type: string
      description: Identificador estable del indicador (clave `id` en `config/indicators_spec.json`).
      enum:
        - solvencia_patrimonial
        - seps_2_proporcion_de_activos_improductiv
        - seps_3_proporcion_de_activos_productivos
        - seps_4_utilizaci_n_del_pasivo_con_costo_
        - morosidad_cartera_total
        - seps_6_morosidad_de_cartera_comercial_pr
        - seps_7_morosidad_de_cartera_de_consumo_p
        - seps_8_morosidad_de_cartera_inmobiliaria
        - seps_9_morosidad_de_microcredito
        - seps_10_morosidad_de_cartera_productiva
        - seps_11_morosidad_de_cartera_comercial_o
        - seps_12_morosidad_de_cartera_de_consumo_
        - seps_13_morosidad_de_cartera_de_vivienda
        - seps_14_morosidad_de_cartera_educativa
        - seps_15_morosidad_de_cartera_comercial
        - seps_16_morosidad_de_cartera_de_consumo
        - seps_17_morosidad_de_cartera_de_vivienda
        - cobertura_cartera_improductiva
        - seps_19_cobertura_de_la_cartera_de_cr_di
        - seps_20_cobertura_de_la_cartera_de_cr_di
        - seps_21_cobertura_de_la_cartera_inmobili
        - seps_22_cobertura_de_la_cartera_de_micro
        - seps_23_cobertura_de_la_cartera_producti
        - seps_24_cobertura_de_la_cartera_comercia
        - seps_25_cobertura_de_la_cartera_de_consu
        - seps_26_cobertura_de_la_cartera_de_vivie
        - seps_27_cobertura_de_la_cartera_de_cr_di
        - seps_28_cobertura_de_la_cartera_comercia
        - seps_29_cobertura_de_la_cartera_de_consu
        - seps_30_cobertura_de_la_cartera_de_vivie
        - eficiencia_operativa
