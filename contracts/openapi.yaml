      example: morosidad_cartera_total
    AggregationLevel:
      type: string
      description: Nivel de agregación de la serie.
      enum: [country, segment, entity]
      example: segment
    Frequency:
      type: string
      description: Periodicidad de reporte de la información.
      enum: [monthly, quarterly]
      example: monthly

    # ---------- Metadata ----------
    Segment:
      type: object
      description: Segmento disponible para filtrar.
      required: [code, label, reporting_frequency, entity_count]
      properties:
        code:
          $ref: '#/components/schemas/SegmentCode'
        label:
          type: string
          description: Etiqueta legible.
          example: Segmento 1
        reporting_frequency:
          $ref: '#/components/schemas/Frequency'
        entity_count:
          type: integer
          minimum: 0
          description: Entidades con datos en el último periodo.
          example: 43
    Province:
      type: object
      description: Provincia disponible para filtrar.
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/ProvinceCode'
        name:
          type: string
          description: Nombre oficial de la provincia en mayúsculas.
          example: PICHINCHA
        entity_count:
          type: integer
          minimum: 0
          description: Entidades con matriz en la provincia.
          example: 99
    PeriodCatalog:
      type: object
      description: Rango de periodos con datos disponibles.
      required: [frequency, min, max, latest, available]
      properties:
        frequency:
          $ref: '#/components/schemas/Frequency'
        min:
          $ref: '#/components/schemas/Period'
        max:
          $ref: '#/components/schemas/Period'
        latest:
          $ref: '#/components/schemas/Period'
        available:
          type: array
          description: Lista ordenada ascendente de periodos con datos.
          items:
            $ref: '#/components/schemas/Period'
          example: ['2025-10', '2025-11', '2025-12']
    IndicatorMeta:
      type: object
      description: Metadatos de presentación de un indicador (derivados de `config/indicators_spec.json`).
      required: [id, name, short_name, category, unit, decimals, polarity]
      properties:
        id:
          $ref: '#/components/schemas/IndicatorId'
        name:
          type: string
          example: Morosidad de cartera total
        short_name:
          type: string
          example: Morosidad
        category:
          type: string
          description: Dimensión de análisis (tipo CAMEL).
          enum: [capital, calidad_de_activos, manejo_administrativo, rentabilidad, liquidez]
          example: calidad_de_activos
        unit:
          type: string
          enum: [percent, ratio, usd]
          example: percent
        decimals:
          type: integer
          minimum: 0
          maximum: 6
          example: 2
        polarity:
          type: string
          description: Sentido deseable del indicador para semaforización.
          enum: [higher_is_better, lower_is_better, neutral]
          example: lower_is_better
        seps_ficha_number:
          type: integer
          description: Número de la ficha en "Fichas Metodológicas de Indicadores Financieros V3.0".
          example: 5
        latest_value:
          type: number
          format: float
          nullable: true
          description: Último valor agregado disponible a nivel nacional.
          example: 7.84
        methodological_note:
          type: string
          nullable: true
          description: Nota metodológica sobre devengo, componentes o estacionalidad.
          example: 'Excedente antes de impuestos de Ene-Nov vs. Excedente neto en Dic'
    FiltersMetadata:
      type: object
      description: Catálogos para los filtros globales de la interfaz.
      required: [segments, provinces, periods, indicators, data_as_of]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        periods:
          $ref: '#/components/schemas/PeriodCatalog'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorMeta'
        data_as_of:
          type: string
          format: date
          description: Última fecha de corte cargada.
          example: '2025-12-31'

    # ---------- Entities ----------
    EntitySummary:
      type: object
      description: Ficha resumida de una entidad financiera.
      required: [ruc, razon_social, entity_type, segment, first_period, last_period, is_active]
      properties:
        ruc:
          $ref: '#/components/schemas/Ruc'
        razon_social:
          type: string
          example: COOPERATIVA DE AHORRO Y CREDITO POLICIA NACIONAL LIMITADA
        entity_type:
          type: string
          enum: [COOPERATIVA, MUTUALISTA, CAJA_CENTRAL]
          example: COOPERATIVA
        segment:
          $ref: '#/components/schemas/SegmentCode'
        province:
          oneOf:
            - $ref: '#/components/schemas/Province'
            - type: 'null'
          description: Provincia de la matriz (null si no está disponible).
        total_assets_usd:
          type: [number, 'null']
          description: Activo total (cuenta 1) en el último periodo reportado, en USD.
          example: 1482900000.0
        first_period:
          $ref: '#/components/schemas/Period'
        last_period:
          $ref: '#/components/schemas/Period'
        is_active:
          type: boolean
          description: Reportó en el último periodo disponible.
          example: true
    Pagination:
      type: object
      description: Metadatos de paginación.
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          example: 50
        total_items:
          type: integer
          minimum: 0
          example: 43
        total_pages:
          type: integer
          minimum: 0
          example: 1
    EntityListResponse:
      type: object
      description: Página de entidades.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntitySummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- Indicators ----------
    SeriesPoint:
      type: object
      description: Observación de un indicador en un periodo.
      required: [period, value]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        value:
          type: [number, 'null']
          description: Valor del indicador en la unidad declarada. `null` si el denominador es <= 0 o no hay datos.
          example: 7.84
        numerator:
          type: [number, 'null']
          description: Numerador agregado en USD (trazabilidad).
          example: 1562063234.78
        denominator:
          type: [number, 'null']
          description: Denominador agregado en USD (trazabilidad).
          example: 19914112605.29
        entity_count:
          type: integer
          minimum: 0
          description: Entidades que aportan al punto.
          example: 203
    Series:
      type: object
      description: Serie de tiempo para una clave del nivel solicitado (país, segmento o RUC).
      required: [key, label, level, points]
      properties:
        key:
          type: string
          description: '`EC` para país, código de segmento o RUC.'
          example: SEGMENTO_1
        label:
          type: string
          example: Segmento 1
        level:
          $ref: '#/components/schemas/AggregationLevel'
        segment:
          $ref: '#/components/schemas/SegmentCode'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    IndicatorSeriesResponse:
      type: object
      description: Respuesta del endpoint de series.
      required: [indicator, level, frequency, period_range, filters_applied, series, generated_at]
      properties:
        indicator:
          $ref: '#/components/schemas/IndicatorMeta'
        level:
          $ref: '#/components/schemas/AggregationLevel'
        frequency:
          $ref: '#/components/schemas/Frequency'
        period_range:
          type: object
          description: Rango efectivo devuelto.
          required: [from, to]
          properties:
            from:
              $ref: '#/components/schemas/Period'
            to:
              $ref: '#/components/schemas/Period'
        filters_applied:
          type: object
          description: Filtros efectivamente aplicados (eco normalizado de la consulta).
          required: [segment, province, ruc]
          properties:
            segment:
              type: array
              items:
                $ref: '#/components/schemas/SegmentCode'
              example: [SEGMENTO_1]
            province:
              type: array
              items:
                $ref: '#/components/schemas/ProvinceCode'
              example: []
            ruc:
              type: array
              items:
                $ref: '#/components/schemas/Ruc'
              example: []
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        generated_at:
          type: string
          format: date-time
          description: Marca de tiempo de generación de la respuesta.
          example: '2026-01-15T10:30:00Z'

    # ---------- Errores ----------
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (Problem Details for HTTP APIs).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://sistema-indicadores.local/problems/validation-error
        title:
          type: string
          example: Error de validación
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          example: "El parámetro 'ruc' es obligatorio cuando level=entity."
        instance:
          type: string
          format: uri-reference
          example: /api/v1/indicators/series?indicator=roa&level=entity
        errors:
          type: array
          description: Errores por campo.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: ruc
              message:
                type: string
                example: required when level=entity
