name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Contract, Guardrails, Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint Python (Ruff)
        run: ruff check backend etl --select E9,F63,F7,F82

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Lint OpenAPI Contract
        run: npm run contract:lint

      - name: Run Mechanical Guardrails
        run: npm run guardrails:check

      - name: Frontend Typecheck & Unit Tests
        run: |
          npm run frontend:typecheck
          npm run frontend:test

      - name: Frontend Production Build
        run: npm run frontend:build

      - name: Verify Parquet Marts (DuckDB)
        run: python etl/test_marts.py

      - name: Run Backend Tests (Pytest)
        run: python -m pytest backend/tests -v
